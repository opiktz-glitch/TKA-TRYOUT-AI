server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Penting untuk React Router: semua route yang tidak match file
    # statis diarahkan balik ke index.html, supaya refresh di
    # /admin/dashboard dsb tidak 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset yang sudah di-hash oleh Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
